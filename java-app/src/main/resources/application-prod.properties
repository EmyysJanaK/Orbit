# Production Environment Configuration
spring.profiles.active=prod

# Database Configuration for Production
spring.datasource.url=jdbc:mysql://${DB_ENDPOINT:localhost:3306}/employeedb?useSSL=true&requireSSL=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration for Production
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Security and Performance
server.error.include-stacktrace=never
server.error.include-message=never

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging Configuration for Production
logging.level.com.employeemgmt=INFO
logging.level.org.springframework.web=WARN
logging.file.name=/var/log/employee-app/application.log
logging.file.max-size=10MB
logging.file.max-history=30
